[package]
name = "orellius-stt"
version = "0.1.0"
description = "Hebrew speech to coherent English, pasted into the focused app"
authors = ["Orellius"]
edition = "2021"

[lib]
name = "orellius_stt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16", features = ["metal"] }
cpal = "0.15"
arboard = "3"
core-graphics = "0.25"
core-foundation = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
window-vibrancy = "0.6"

[profile.release]
lto = true
opt-level = 3
