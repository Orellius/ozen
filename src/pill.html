<!doctype html>
<!-- The always-on-top capsule: a tiny transparent window driven by the same Rust "state" /
     "result" / "error" events as the dashboard. No logic of its own - pure status mirror. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  #capsule {
    box-sizing: border-box;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-radius: 22px;
    background: rgba(18, 18, 20, 0.82);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    font: 500 13px/1 -apple-system, "SF Pro Text", sans-serif;
    color: #f2f2f7;
    direction: rtl;
  }
  #dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
    background: #8e8e93;
  }
  #dot[data-state="recording"] {
    background: #ff453a;
    animation: pulse 1.1s ease-in-out infinite;
  }
  #dot[data-state="transcribing"] { background: #ffd60a; animation: pulse 0.7s ease-in-out infinite; }
  #dot[data-state="translating"]  { background: #64d2ff; animation: pulse 0.7s ease-in-out infinite; }
  #dot[data-state="done"]         { background: #30d158; }
  #dot[data-state="error"]        { background: #ff453a; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.35); opacity: 0.55; }
  }
  #text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
  }
</style>
</head>
<body>
  <div id="capsule"><span id="dot"></span><span id="text">מוכן</span></div>
  <script>
    const { listen } = window.__TAURI__.event;
    const dot = document.getElementById("dot");
    const text = document.getElementById("text");
    const STATE_TEXT = {
      recording: "מקליט…",
      transcribing: "מתמלל…",
      translating: "מתרגם…",
      error: "שגיאה",
    };
    function set(state, label) {
      dot.dataset.state = state;
      text.textContent = label;
    }
    listen("state", (e) => {
      const s = e.payload;
      if (s === "idle") return; // Rust hides the pill; keep the last flash visible until then.
      set(s, STATE_TEXT[s] || "");
    });
    // Flash what was pasted (green) just before Rust hides the pill.
    listen("result", (e) => set("done", e.payload.english));
    listen("error", (e) => set("error", e.payload));
  </script>
</body>
</html>
