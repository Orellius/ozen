<!doctype html>
<!-- The orb: a Dock-tile squircle of milky glass with a living light inside it.

     The glass is NOT drawn here. It is a real NSVisualEffectView applied to the WINDOW
     (see show_pill in lib.rs) - CSS backdrop-filter on a transparent Tauri window paints a
     square halo, measured 2026-08-06. This page is fully transparent and contributes only
     the tile's edge treatment plus the canvas light.

     The light is one asymmetric blob that drifts inside the frame, deformed by several
     harmonics at unrelated frequencies so it never visibly repeats, lit from an off-centre
     core so it reads as glowing from within rather than as a coloured shape. State is
     colour and behaviour: idle breathes, recording follows the REAL mic level ("level"
     events, ~30Hz), transcribing/translating churn, paste flashes green, error red. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  :root {
    /* One source of truth for the tile geometry: the window is 72x72 and lib.rs clips the
       vibrancy material to this same radius. Change one, change both. */
    --size: 72px;
    --radius: 16px;
  }
  html, body {
    margin: 0;
    width: var(--size);
    height: var(--size);
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  body:active { cursor: grabbing; }

  /* Clips the light to the tile. Without it the glow squares off at the window corners and
     the squircle silhouette is lost. */
  #tile {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: var(--size);
    height: var(--size);
  }
  /* The edge treatment that makes it read as a Dock tile rather than a floating rectangle:
     a bright specular hairline along the top, a hairline outline, and a contact shade at the
     bottom. All inset - the window is exactly tile-sized, so an outer shadow would be clipped. */
  #edge {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    pointer-events: none;
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.55),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.14),
      inset 0 -1px 1.5px rgba(0, 0, 0, 0.28);
  }
</style>
</head>
<body>
  <div id="tile"><canvas id="eq"></canvas></div>
  <div id="edge"></div>
  <script>
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    // Native drag from anywhere on the tile.
    document.body.addEventListener("mousedown", (e) => {
      if (e.buttons === 1) getCurrentWindow().startDragging();
    });

    const SIZE = 72;
    const canvas = document.getElementById("eq");
    const DPR = window.devicePixelRatio || 2;
    canvas.width = SIZE * DPR;
    canvas.height = SIZE * DPR;
    const ctx = canvas.getContext("2d");
    ctx.scale(DPR, DPR);

    const C = SIZE / 2;

    // Each state is a light, not a colour swatch: `core` is the hot centre, `rim` the falloff,
    // `energy` how hard the blob is driven, `drift` how far it wanders from centre.
    // `glow` is the light SPILLING onto the glass, and it is deliberately 0 at idle. Painting
    // it at idle fills the whole tile with a haze of the rim colour, so the orb sits in a navy
    // wash instead of floating in clear glass. The spill belongs to activity, not to presence.
    const STATES = {
      idle:         { core: [200, 218, 255], rim: [120, 150, 220], energy: 0.16, drift: 2.2, speed: 0.30, glow: 0.00 },
      recording:    { core: [255, 214, 202], rim: [255,  69,  58], energy: 1.00, drift: 5.0, speed: 1.15, glow: 0.55 },
      transcribing: { core: [255, 240, 190], rim: [255, 214,  10], energy: 0.52, drift: 4.0, speed: 0.95, glow: 0.30 },
      translating:  { core: [206, 244, 255], rim: [100, 210, 255], energy: 0.52, drift: 4.0, speed: 0.95, glow: 0.30 },
      done:         { core: [214, 255, 224], rim: [ 48, 209,  88], energy: 0.70, drift: 2.0, speed: 0.55, glow: 0.45 },
      error:        { core: [255, 205, 200], rim: [255,  69,  58], energy: 0.85, drift: 1.5, speed: 1.30, glow: 0.45 },
    };

    let mode = "idle";
    let level = 0;        // live mic RMS, 0..~0.2
    let flashUntil = 0;
    // Everything the eye sees is an eased value, never the raw target - a snap between states
    // reads as a glitch, and the whole point is that this thing feels alive.
    let shown = {
      core: [...STATES.idle.core],
      rim: [...STATES.idle.rim],
      energy: 0.16,
      drift: 2.2,
      speed: 0.3,
      glow: 0.0,
    };
    let loudness = 0;

    listen("state", (e) => {
      const s = e.payload;
      if (s === "idle") {
        if (Date.now() >= flashUntil) mode = "idle";
        return;
      }
      mode = s;
    });
    listen("level", (e) => { level = e.payload; });
    listen("result", () => { mode = "done"; flashUntil = Date.now() + 1200; });
    listen("error", () => { mode = "error"; flashUntil = Date.now() + 1600; });

    const lerp = (a, b, k) => a + (b - a) * k;
    const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

    /**
     * The blob outline. Radius per angle is a base plus several harmonics whose frequencies
     * share no common factor (2/3/5/7) and whose phases advance at different rates - so the
     * silhouette is asymmetric and never returns to the same shape. `wob` scales all of it,
     * which is what turns speech loudness into agitation.
     */
    function blobPath(cx, cy, r, wob, t, seed) {
      const N = 72;
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const a = (i / N) * Math.PI * 2;
        const d =
          Math.sin(a * 2 + t * 0.9 + seed) * 0.55 +
          Math.sin(a * 3 - t * 1.3 + seed * 2.1) * 0.3 +
          Math.sin(a * 5 + t * 0.6 + seed * 3.7) * 0.16 +
          Math.sin(a * 7 - t * 1.9 + seed * 1.3) * 0.08;
        const rr = r * (1 + d * wob);
        const x = cx + Math.cos(a) * rr;
        const y = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    let t = 0;
    function frame() {
      const target = STATES[mode] || STATES.idle;
      // Ease every property toward the active state. 0.07 is slow enough to see the change
      // happen and fast enough that a stage boundary still feels immediate.
      for (let i = 0; i < 3; i++) {
        shown.core[i] = lerp(shown.core[i], target.core[i], 0.07);
        shown.rim[i] = lerp(shown.rim[i], target.rim[i], 0.07);
      }
      shown.energy = lerp(shown.energy, target.energy, 0.07);
      shown.drift = lerp(shown.drift, target.drift, 0.07);
      shown.speed = lerp(shown.speed, target.speed, 0.07);
      shown.glow = lerp(shown.glow, target.glow, 0.07);

      // Mic level is spiky; ease it too, asymmetrically - fast attack so a syllable registers,
      // slow release so the orb keeps glowing through the gaps between words.
      const raw = Math.min(1, level * 9);
      loudness = raw > loudness ? lerp(loudness, raw, 0.45) : lerp(loudness, raw, 0.1);

      t += 0.016 * (0.6 + shown.speed);
      ctx.clearRect(0, 0, SIZE, SIZE);

      // Slow Lissajous wander: the light is never parked dead-centre, which is what stops it
      // looking like a logo and starts it looking like something inhabiting the tile.
      const amp = shown.drift * (0.55 + 0.45 * (mode === "recording" ? loudness : 1));
      const cx = C + Math.sin(t * 0.53) * amp + Math.sin(t * 0.19) * amp * 0.4;
      const cy = C + Math.cos(t * 0.41) * amp * 0.85 + Math.cos(t * 0.23) * amp * 0.35;

      const breathe = 1 + 0.05 * Math.sin(t * 1.1);
      const drive = mode === "recording" ? loudness : 1;
      const radius = 15 * breathe * (0.72 + 0.34 * shown.energy * drive);
      const wob = 0.1 + 0.2 * shown.energy * (0.45 + 0.55 * drive);

      // Outer halo: the light spilling onto the glass while something is happening. Skipped
      // entirely once it fades out, so at rest the glass stays clear and the orb floats.
      const spill = shown.glow * (mode === "recording" ? 0.35 + 0.65 * drive : 1);
      if (spill > 0.02) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.filter = "blur(6px)";
        ctx.fillStyle = rgba(shown.rim, 0.42 * spill);
        blobPath(cx, cy, radius * 1.16, wob * 0.8, t * 0.8, 0.0);
        ctx.fill();
        ctx.restore();
      }

      // The body. The gradient origin is offset up-left from the blob centre, so the highlight
      // sits where a light source above-left would put it and the form reads as three
      // dimensional instead of flat.
      const lx = cx - radius * 0.34;
      const ly = cy - radius * 0.4;
      const g = ctx.createRadialGradient(lx, ly, radius * 0.06, cx, cy, radius * 1.25);
      g.addColorStop(0.0, rgba(shown.core, 0.98));
      g.addColorStop(0.35, rgba(shown.rim, 0.8));
      g.addColorStop(1.0, rgba(shown.rim, 0.05));
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g;
      blobPath(cx, cy, radius, wob, t, 0.0);
      ctx.fill();
      ctx.restore();

      // The core: a second, smaller blob on its own phase, drifting against the body. Two
      // bodies moving at different rates is what makes it look internally alive rather than
      // like one shape being scaled.
      const kx = cx + Math.sin(t * 0.77 + 1.7) * radius * 0.18;
      const ky = cy + Math.cos(t * 0.61 + 0.9) * radius * 0.18;
      const cg = ctx.createRadialGradient(kx, ky, 0, kx, ky, radius * 0.62);
      cg.addColorStop(0.0, rgba([255, 255, 255], 0.55 + 0.35 * drive));
      cg.addColorStop(0.45, rgba(shown.core, 0.32));
      cg.addColorStop(1.0, rgba(shown.core, 0.0));
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = cg;
      blobPath(kx, ky, radius * 0.52, wob * 1.5, t * 1.35 + 2.0, 4.2);
      ctx.fill();
      ctx.restore();

      // Specular sweep across the top of the tile - the glass catching the light, not the orb.
      const sg = ctx.createLinearGradient(0, 0, 0, SIZE * 0.55);
      sg.addColorStop(0, "rgba(255,255,255,0.10)");
      sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, SIZE, SIZE * 0.55);

      if ((mode === "done" || mode === "error") && Date.now() >= flashUntil) mode = "idle";
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
