<!doctype html>
<!-- The orb: a Dock-tile squircle of milky glass with a CHARACTER in it, and a steps drawer
     that opens while a clip is being processed.

     The glass is NOT drawn here. It is a real NSVisualEffectView applied to the WINDOW
     (see show_pill in lib.rs) - CSS backdrop-filter on a transparent Tauri window paints a
     square halo, measured 2026-08-06. This page is fully transparent and contributes only
     the tile's edge treatment plus what is drawn on the canvas.

     WHAT CHANGED IN 0.7.0 (Orel's call, 2026-08-08):
     - The capybara is gone. The character is a paperclip assistant, drawn from a reference Orel
       supplied after two attempts from memory came out wrong the same way twice. He has no limbs,
       so posture, eyes and brows do all the acting - see drawClippy for the tells that matter.
     - A GAG REEL of 19 idle animations fires at random, roughly once every 25 to 70 seconds of
       idling and NEVER during real work. The point is novelty decay: a fixed joke dies from
       repetition, and this thing is seen dozens of times a day.
     - MIC LEVEL no longer has a mouth to drive (a paperclip has none). It survives in the halo
       and in the menu-bar meter, which is why the halo must not be removed.

     WHAT CHANGED IN 0.6.0 (Orel's call, 2026-08-06):
     - The synapse web is gone; a character replaced it, and its MOUTH WAS THE MIC LEVEL, so the
       question the indicator exists to answer ("are you hearing me?") was answered by the first
       thing the eye lands on rather than by a colour the user has to learn.
     - The character REACTS per stage: leaning in while listening, pad and pen out
       and writing while transcribing, pen tapping while translating, page handed over on paste.
     - A STEPS DRAWER opens while a clip is in flight: hear - transcribe - translate - deliver,
       each with a live timer, so the current stage is visible at a glance. It shows the STEPS
       and NOT the transcript: reading text back here would mean digging through a transcript,
       which is what the dashboard is for.

     The window is resizable (56..480 square at rest). Opening the drawer resizes the window
     itself, and the tile size the user chose is remembered across open/close. -->
<html lang="he">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
    font: 11px/1.3 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  body:active { cursor: grabbing; }

  /* LTR on purpose even though the labels are Hebrew: the tile must stay anchored where the
     user parked it and the drawer must grow to the RIGHT. In RTL the canvas would sit at the
     right edge and the window would appear to jump sideways every time a clip starts. */
  /* No rounding and no clip: there is no tile any more, so a radius here would cut the
     character's own drop shadow off at an invisible edge. */
  /* column-reverse puts the notepad ABOVE the character: children are canvas then steps, and
     reversing stacks the steps on top. LTR on purpose even with Hebrew labels, so the tile stays
     anchored where the user parked it. */
  #wrap {
    position: absolute; inset: 0; display: flex; flex-direction: column-reverse;
    align-items: center; justify-content: flex-start; direction: ltr;
  }
  canvas { display: block; flex: none; }

  /* THE NOTEPAD. His yellow legal pad, floating above him as a thought bubble - the thing he
     always wrote on. It replaces the side drawer: a column growing rightwards pushed the orb off
     its parked spot, and the steps read as a system panel rather than as something HE is doing. */
  #steps {
    display: none; flex-direction: column; justify-content: center;
    gap: 1px; width: 132px; margin-bottom: 4px;
    padding: 7px 9px 8px;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0 15px,
        rgba(90, 120, 190, 0.30) 15px 16px
      ),
      linear-gradient(#fdf3b8, #f6e392);
    border-radius: 3px 3px 4px 4px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.5) inset;
    transform: rotate(-1.4deg);
    position: relative;
  }
  /* The red margin rule down the left, which is most of what makes a legal pad legible as one. */
  #steps::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 15px;
    border-left: 1px solid rgba(210, 80, 80, 0.45);
  }
  /* The bubble's tail, pointing down at him. */
  #steps::after {
    content: ""; position: absolute; bottom: -5px; left: 50%;
    width: 9px; height: 9px; margin-left: -4px;
    background: #f6e392; transform: rotate(45deg);
    box-shadow: 2px 2px 4px rgba(0,0,0,0.25);
  }
  #wrap.open #steps { display: flex; }
  .step {
    display: flex; align-items: center; gap: 6px; direction: rtl;
    color: rgba(60, 60, 80, 0.45); white-space: nowrap; font-size: 10.5px;
    line-height: 15px; transition: color .18s ease;
  }
  .step .dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: rgba(60, 60, 80, 0.22);
    box-shadow: none;
  }
  .step .name { flex: 1; }
  .step .t { font-variant-numeric: tabular-nums; font-size: 10px; opacity: 0.75; direction: ltr; }
  .step.done { color: rgba(50, 55, 75, 0.62); }
  .step.done .dot { background: #2f9e6e; }
  .step.live { color: #1b1f2c; font-weight: 700; }
  .step.live .dot { background: #2f6fd0; animation: pulse 1s ease-in-out infinite; }
  .step.fail { color: #a8322b; }
  .step.fail .dot { background: #c0392b; }
  @keyframes pulse { 50% { transform: scale(0.6); opacity: 0.55; } }

  /* The edge treatment that makes it read as a Dock tile rather than a floating rectangle:
     a bright specular hairline along the top, a hairline outline, and a contact shade at the
     bottom. All inset - the window is exactly tile-sized, so an outer shadow would be clipped. */
  /* The tile's edge treatment is gone with the tile. Kept as an empty element rather than
     deleted so the layout and the drag guard keep the geometry they were tuned against. */
  #edge { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="eq"></canvas>
    <div id="steps"></div>
  </div>
  <div id="edge"></div>
  <script>
    // Degrade to a standalone page when there is no Tauri around it. This is not defensive
    // padding: it means this exact file can be opened in a browser and judged - animation and
    // all - without a multi-minute Rust rebuild in between. The fake driver cycles the states
    // and feeds a plausible mic level so a preview exercises every one of them.
    const TAURI = typeof window.__TAURI__ !== "undefined";
    const listen = TAURI
      ? window.__TAURI__.event.listen
      : (name, cb) => {
          if (name === "level") {
            setInterval(() => cb({ payload: 0.015 + Math.random() * 0.11 }), 60);
          }
          if (name === "uilang") {
            let en = false;
            setInterval(() => { en = !en; cb({ payload: en ? "en" : "he" }); }, 14400);
          }
          if (name === "state") {
            const cycle = ["idle", "recording", "recording", "transcribing", "translating", "pasting"];
            let i = 0;
            setInterval(() => cb({ payload: cycle[i++ % cycle.length] }), 2400);
          }
        };

    if (TAURI) {
      // Native drag from the middle of the tile - but NOT from the edges. The window is
      // borderless and resizable, so macOS owns a thin resize band around the frame; grabbing
      // there must resize, not move. Without this guard startDragging swallows every resize
      // attempt and the window silently cannot be resized at all.
      const EDGE = 8;
      const { getCurrentWindow } = window.__TAURI__.window;
      document.body.addEventListener("mousedown", (e) => {
        if (e.buttons !== 1) return;
        const onEdge =
          e.clientX < EDGE ||
          e.clientY < EDGE ||
          e.clientX > window.innerWidth - EDGE ||
          e.clientY > window.innerHeight - EDGE;
        if (onEdge) return;
        getCurrentWindow().startDragging();
      });
    }

    /* ============================ THE STEPS DRAWER ============================
       Four steps, in pipeline order, each carrying a live timer while it runs and its final
       duration once it is done. The timer is what makes a slow stage legible as a slow stage
       rather than as a hang: a 6s translate reads as "the translator is working", which is the
       one thing a spinner can never say. */
    // The drawer speaks the language of the app you are dictating INTO, not the language you are
    // speaking. Emitted as "uilang" from Rust when a recording arms, derived the way macOS derives
    // it: the first of your preferred languages that the target app actually localises.
    const STEPS = [
      { key: "recording",    he: "שומע",  en: "Hearing" },
      { key: "transcribing", he: "מתמלל", en: "Transcribing" },
      { key: "translating",  he: "מתרגם", en: "Translating" },
      { key: "pasting",      he: "מוסר",  en: "Delivering" },
    ];
    let uilang = "he";
    const stepsEl = document.getElementById("steps");
    const wrap = document.getElementById("wrap");
    const rows = STEPS.map((s) => {
      const el = document.createElement("div");
      el.className = "step";
      el.innerHTML = `<span class="dot"></span><span class="name">${s.he}</span><span class="t"></span>`;
      stepsEl.appendChild(el);
      return { ...s, el, name: el.querySelector(".name"), t: el.querySelector(".t"),
               started: 0, ms: 0, state: "pending" };
    });

    /// Relabel in place. The direction flips with the language: Hebrew step names in a
    /// left-aligned row read as broken, and the timer column has to swap sides with them.
    function setLang(lang) {
      uilang = lang === "he" ? "he" : "en";
      for (const r of rows) {
        r.name.textContent = uilang === "he" ? r.he : r.en;
        r.el.style.direction = uilang === "he" ? "rtl" : "ltr";
      }
    }
    listen("uilang", (e) => setLang(e.payload));

    function resetSteps() {
      for (const r of rows) {
        r.state = "pending"; r.started = 0; r.ms = 0;
        r.el.className = "step"; r.t.textContent = "";
      }
    }
    /** Mark `key` live; everything before it is done. Order carries the completion, so a stage
        that is skipped entirely (translation off) still closes out the ones behind it. */
    function markLive(key) {
      const idx = rows.findIndex((r) => r.key === key);
      if (idx < 0) return;
      rows.forEach((r, i) => {
        if (i < idx) {
          if (r.state === "live") { r.ms = performance.now() - r.started; }
          if (r.state !== "pending" || r.ms) { r.state = "done"; r.el.className = "step done"; }
          if (r.ms) r.t.textContent = (r.ms / 1000).toFixed(1) + "s";
        } else if (i === idx) {
          if (r.state !== "live") { r.state = "live"; r.started = performance.now(); }
          r.el.className = "step live";
        }
      });
    }
    function finishSteps(ok) {
      for (const r of rows) {
        if (r.state === "live") {
          r.ms = performance.now() - r.started;
          r.state = ok ? "done" : "fail";
          r.el.className = "step " + (ok ? "done" : "fail");
          r.t.textContent = (r.ms / 1000).toFixed(1) + "s";
        }
      }
      if (ok) {
        const last = rows[rows.length - 1];
        if (last.state === "pending") { last.state = "done"; last.el.className = "step done"; }
      }
    }
    function tickTimers() {
      for (const r of rows) {
        if (r.state === "live") r.t.textContent = ((performance.now() - r.started) / 1000).toFixed(1) + "s";
      }
    }

    /* ==================== WINDOW GEOMETRY: OPEN AND CLOSE ====================
       The tile size is the user's; the drawer is ours. `tileSize` is captured only while idle,
       so a resize made with the drawer open cannot be mistaken for a new tile size. */
    // The pad's height is MEASURED, not guessed. The first version reserved 84px for something
    // that needs about 82 before its tilt, tail and shadow - two pixels of slack - and in a
    // column-reverse flex the overflow goes off the TOP, so the pad was sliced in half. A constant
    // here also silently breaks the moment the step labels change language or the font metrics
    // move. Ask the element.
    const PAD_SLACK = 14;    // the ::after tail (5px) plus the drop shadow, which live outside the box
    const PAD_W = 158;       // the pad is wider than a small tile, so the window may widen too
    function measurePadH() {
      const wasOpen = wrap.classList.contains("open");
      if (!wasOpen) wrap.classList.add("open");
      const h = Math.ceil(stepsEl.getBoundingClientRect().height);
      if (!wasOpen) wrap.classList.remove("open");
      return h + PAD_SLACK;
    }
    let geomBusy = false;
    let openedFromX = 0, openedFromY = 0;   // where the tile sat before the pad pushed it up

    async function setOpen(open) {
      if (open === isOpen || geomBusy) return;
      // Standalone preview: there is no window to resize, but the pad must still open, or the
      // browser preview silently cannot show the thing it exists to let us judge.
      if (!TAURI) { isOpen = open; wrap.classList.toggle("open", open); fit(); return; }
      geomBusy = true;
      try {
        const { getCurrentWindow, LogicalSize, LogicalPosition } = window.__TAURI__.window;
        const win = getCurrentWindow();
        const scale = await win.scaleFactor();
        const size = (await win.innerSize()).toLogical(scale);
        const pos = (await win.outerPosition()).toLogical(scale);
        if (!open) {
          // Put the window back exactly where the tile was: the height came off the TOP, so the
          // origin has to come back down by the same amount or he walks up the screen every clip.
          await win.setSize(new LogicalSize(tileSize, tileSize));
          await win.setPosition(new LogicalPosition(openedFromX, openedFromY));
        } else {
          tileSize = Math.round(Math.min(size.width, size.height));
          openedFromX = pos.x; openedFromY = pos.y;
          const w = Math.max(tileSize, PAD_W);
          const h = tileSize + measurePadH();
          // The pad opens UPWARD, so the window's origin moves up by the added height and the
          // tile stays under the user's cursor. If there is no room above, take it from below by
          // leaving the origin alone - a pad off the top of the screen is a pad that does not exist.
          const grewBy = h - Math.round(size.height);
          const widenBy = Math.round((w - Math.round(size.width)) / 2);
          const y = pos.y - grewBy >= 4 ? pos.y - grewBy : pos.y;
          const x = Math.max(0, Math.min(window.screen.availWidth - w, pos.x - Math.max(0, widenBy)));
          await win.setSize(new LogicalSize(w, h));
          await win.setPosition(new LogicalPosition(x, y));
        }
        isOpen = open;
        wrap.classList.toggle("open", open);
        fit();
      } catch (e) {
        // A geometry failure must never take the indicator down with it: the character keeps
        // animating in whatever size the window happens to be.
        console.error("[pill] resize failed", e);
        isOpen = open;
        wrap.classList.toggle("open", open);
        fit();
      } finally {
        geomBusy = false;
      }
    }
    if (!TAURI) {
      // Standalone preview: no window to resize, so just toggle the class.
      window.__previewOpen = (v) => wrap.classList.toggle("open", v);
    }

    /* ============================== THE CHARACTER ==============================
       One rig, read by the draw code: eyes 1 = wide open / 0 = shut, mouth 0 = closed / 1 =
       wide, look = where the pupils point, ears = perk, prop = what he is holding. */
    // Declared here, above fit(), because fit() now depends on both: the canvas must keep the
    // user's tile size while the window is temporarily larger for the notepad.
    let isOpen = false;
    let tileSize = 104;

    const canvas = document.getElementById("eq");
    const DPR = window.devicePixelRatio || 2;
    const ctx = canvas.getContext("2d");
    let TILE = 104;

    function fit() {
      // The canvas is the SQUARE part of the window - but ONLY the tile the user sized. Deriving
      // it from the window was correct while the drawer grew sideways and wrong the moment the
      // notepad arrived: the window widens to fit the pad, so min(w,h) picked up the PAD's width
      // and the character visibly grew by half every time a clip started. Measured 2026-08-08 on
      // Orel's report ("why clippy resizes when speaks"): tile 104 -> canvas 158 while open.
      TILE = isOpen
        ? tileSize
        : Math.max(48, Math.min(window.innerWidth, window.innerHeight));
      canvas.style.width = TILE + "px";
      canvas.style.height = TILE + "px";
      canvas.width = Math.round(TILE * DPR);
      canvas.height = Math.round(TILE * DPR);
    }
    fit();
    window.addEventListener("resize", fit);

    const TINT = {
      idle:         [150, 170, 200],
      recording:    [110, 168, 255],
      transcribing: [150, 140, 235],
      translating:  [190, 130, 225],
      pasting:      [ 90, 200, 255],
      done:         [ 82, 209, 164],
      error:        [255, 107, 107],
    };

    let mode = "idle";
    let level = 0;      // live mic RMS, 0..~0.2
    let flashUntil = 0;
    let blinkAt = 0, blinkTil = 0;

    listen("state", (e) => {
      const s = e.payload;
      if (s === "idle") {
        if (Date.now() >= flashUntil) { mode = "idle"; setOpen(false); }
        return;
      }
      if (s === "recording") { resetSteps(); setOpen(true); }
      if (s === "error") { finishSteps(false); mode = "error"; flashUntil = Date.now() + 1800; return; }
      mode = s;
      markLive(s);
    });
    let levelSmooth = 0;
    listen("level", (e) => { level = e.payload; });
    listen("result", () => {
      finishSteps(true);
      mode = "done";
      flashUntil = Date.now() + 1600;
      // Hold the finished steps on screen briefly - the whole point is being able to SEE what
      // it did, and a drawer that vanishes the instant it finishes cannot be read.
      setTimeout(() => { if (Date.now() >= flashUntil - 50) setOpen(false); }, 1700);
    });
    listen("error", () => {
      finishSteps(false);
      mode = "error";
      flashUntil = Date.now() + 1800;
      setTimeout(() => setOpen(false), 2000);
    });

    function rig(st, loud, t, blink) {
      switch (st) {
        case "recording":
          return { eyes: 1.0 * blink, mouth: 0.12 + 0.88 * loud, look: [0, 0.05], ears: 1, lean: 0.5,
                   prop: "none", tint: TINT.recording };
        case "transcribing":
          return { eyes: 0.9 * blink, mouth: 0.06, look: [0.15, 0.75], ears: 0.4, lean: 0.25,
                   prop: "write", tint: TINT.transcribing };
        case "translating":
          return { eyes: 0.85 * blink, mouth: 0.05, look: [0.55 * Math.sin(t * 1.1 + 1), -0.5],
                   ears: 0.2, lean: 0, prop: "think", tint: TINT.translating };
        case "pasting":
          return { eyes: 1.0 * blink, mouth: 0.25, look: [0, -0.1], ears: 0.7, lean: 0,
                   prop: "show", tint: TINT.pasting };
        case "done":
          return { eyes: 0, mouth: 0.55, look: [0, 0], ears: 1, lean: 0, happy: true,
                   prop: "hand", tint: TINT.done };
        case "error":
          // Ears flat, eyes wide, mouth small. Distress without a scary face - this fires on a
          // failed paste, not on a catastrophe.
          return { eyes: 1.0, mouth: 0.10, look: [0.3 * Math.sin(t * 8), 0.3], ears: 0, lean: 0,
                   prop: "none", tint: TINT.error };
        default:
          return { eyes: 0.82 * blink, mouth: 0.03, look: [0.25 * Math.sin(t * 0.4), 0.1],
                   ears: 0.6, lean: 0, prop: "none", tint: TINT.idle };
      }
    }

    function eye(c, x, y, r, open, look, happy) {
      if (happy) {
        // A closed, upturned arc reads as delight; a straight closed line reads as asleep.
        c.lineWidth = Math.max(1.4, r * 0.42); c.lineCap = "round";
        c.strokeStyle = "#1b2029";
        c.beginPath(); c.arc(x, y + r * 0.25, r * 0.95, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
        return;
      }
      const h = Math.max(0.06, open);
      c.fillStyle = "#1b2029";
      c.beginPath(); c.ellipse(x, y, r, r * h, 0, 0, 6.2832); c.fill();
      if (h > 0.35) {
        // Two highlights, unequal: one specular dot and one faint rim. A single centred dot is
        // what makes cartoon eyes look dead.
        c.fillStyle = "rgba(255,255,255,0.95)";
        c.beginPath(); c.arc(x + r * (0.34 + look[0] * 0.2), y - r * (0.30 - look[1] * 0.2), r * 0.30, 0, 6.2832); c.fill();
        c.fillStyle = "rgba(255,255,255,0.35)";
        c.beginPath(); c.arc(x - r * 0.36, y + r * 0.30, r * 0.15, 0, 6.2832); c.fill();
      }
    }

    function mouth(c, x, y, w, open) {
      // Clamped: at full mic level an unclamped ellipse runs past the bottom of the muzzle and
      // reads as a drip hanging off the chin rather than as an open mouth.
      const h = Math.max(1.2, w * Math.min(open, 0.62) * 0.8);
      c.fillStyle = "#1b2029";
      c.beginPath();
      if (open < 0.14) {
        c.roundRect(x - w * 0.42, y - 0.9, w * 0.84, 1.8, 1.2);
      } else {
        c.ellipse(x, y + h * 0.10, w * (0.36 + open * 0.14), h * 0.86, 0, 0, 6.2832);
      }
      c.fill();
      if (open > 0.3) {
        // A tongue, not the state colour: tinting it made him drip blue while listening.
        c.fillStyle = "rgba(214,126,138,0.9)";
        c.beginPath(); c.ellipse(x, y + h * 0.5, w * 0.20, h * 0.30, 0, 0, 6.2832); c.fill();
      }
    }

    /* PROPS. The character reacts by DOING something: pad and pen out for transcribing, pen
       lifted and tapping for translating, page held up while delivering, handed over on done.
       HONEST LIMIT: below ~90px of tile the pad is four grey pixels, so smaller tiles get a
       compact page glyph instead. If the character is the point, size the orb above 90. */
    function drawProps(c, W, r, t) {
      if (r.prop === "none") return;
      const u = W / 100;
      if (W < 90) {
        const x = u * 30, y = u * 30;
        // Legal-pad yellow, the same paper as the notepad above his head - it should read as the
        // same object in his hand and over his head, not as two different props.
        c.fillStyle = "#f6e392";
        c.beginPath(); c.roundRect(x - u * 9, y - u * 11, u * 18, u * 22, u * 3); c.fill();
        c.strokeStyle = "rgba(70,100,170,0.55)"; c.lineWidth = Math.max(1, u * 1.2);
        const lines = r.prop === "write" ? 1 + Math.floor((t * 3) % 3) : 3;
        for (let i = 0; i < lines; i++) {
          c.beginPath(); c.moveTo(x - u * 5.5, y - u * 5 + i * u * 5); c.lineTo(x + u * 5.5, y - u * 5 + i * u * 5); c.stroke();
        }
        return;
      }
      const writing = r.prop === "write", think = r.prop === "think";
      const show = r.prop === "show", hand = r.prop === "hand";
      const slide = hand ? Math.min(1, ((t * 1.2) % 1) * 1.6) : 0;
      const px = show ? 0 : u * (writing ? 16 : 20) + slide * u * 46;
      const py = show ? u * 6 : u * 34;

      c.save();
      c.translate(px, py); c.rotate(show ? 0 : writing ? 0.16 : 0.1);
      c.scale(show ? 1.15 : 0.95, show ? 1.15 : 0.95);
      c.globalAlpha = hand ? 1 - slide * 0.85 : 1;
      c.fillStyle = "#f6e392";                      // legal-pad yellow, matching the notepad above
      c.beginPath(); c.roundRect(-u * 17, -u * 21, u * 34, u * 42, u * 3); c.fill();
      c.strokeStyle = "rgba(150,120,40,0.35)"; c.lineWidth = Math.max(1, u * 0.9);
      c.beginPath(); c.roundRect(-u * 17, -u * 21, u * 34, u * 42, u * 3); c.stroke();
      // The red margin rule, which is most of what makes a legal pad legible as one at this size.
      c.strokeStyle = "rgba(210,80,80,0.45)"; c.lineWidth = Math.max(0.8, u * 0.8);
      c.beginPath(); c.moveTo(-u * 11, -u * 21); c.lineTo(-u * 11, u * 21); c.stroke();
      // While writing the lines fill in one at a time and the last one is short. A full page of
      // text under a pen that is still moving is the tell of a fake writing animation.
      const total = 5;
      const filled = writing ? 1 + Math.floor((t * 1.6) % total) : total;
      c.strokeStyle = "rgba(45,70,140,0.60)"; c.lineWidth = Math.max(1, u * 1.6); c.lineCap = "round";
      for (let i = 0; i < filled; i++) {
        const w = i === filled - 1 && writing ? u * (6 + 14 * ((t * 1.6) % 1)) : u * 24;
        const y = -u * 14 + i * u * 7.5;
        c.beginPath(); c.moveTo(-u * 12, y); c.lineTo(-u * 12 + w, y); c.stroke();
      }
      c.restore();

      if (writing || think) {
        const tapY = think ? Math.sin(t * 6) * u * 3 : 0;
        const runX = writing ? u * (6 + 14 * ((t * 1.6) % 1)) : 0;
        c.save();
        c.translate(
          writing ? px - u * 12 + runX : u * 26,
          writing ? py - u * 14 + Math.floor((t * 1.6) % 5) * u * 7.5 : -u * 8 + tapY
        );
        c.rotate(writing ? -0.7 : -0.35);
        c.fillStyle = "#2f6fd0";
        c.beginPath(); c.roundRect(-u * 1.8, -u * 20, u * 3.6, u * 20, u * 1.6); c.fill();
        c.fillStyle = "#1b1611";
        c.beginPath(); c.moveTo(-u * 1.8, 0); c.lineTo(u * 1.8, 0); c.lineTo(0, u * 4); c.closePath(); c.fill();
        c.restore();
      }
    }

    /* CLIPPY. Traced from the reference on 2026-08-08 after two attempts drawn from memory came
       out wrong the same way twice - I kept building the clip upside down. The construction that
       actually matters:
         - both U-bends at the BOTTOM, nested (a wide outer one, a narrow inner one),
         - joined by a narrow ARCH at the top, whose two legs are what the eyes sit on,
         - two free ends, both around mid-height, one per U,
         - eyes ENORMOUS and VERTICALLY OFFSET from each other (left higher). Level eyes read as
           a robot; the offset is most of the charm,
         - brows as thick TAPERED black shapes, well clear of the eyes, at opposing angles,
         - lavender wire, never grey, and never drawn upright.
       Geometry is in u = W/100 units so every number below is a percentage of the tile. */
    function clipWire(c, u, squash, bend, jaw) {
      const xInL = -6 * u + bend, xInR = 6 * u, xOutL = -16 * u, xOutR = 12 * u, xArchL = -10 * u;
      const yMid = -2 * u * squash, yInU = 20 * u * squash;
      const yOutU = 26 * u * squash, yArch = -30 * u * squash;

      // Everything except the outer-right arm: one continuous wire, ending at the hinge.
      c.beginPath();
      c.moveTo(xInL, yMid);
      c.lineTo(xInL, yInU);
      c.arc((xInL + xInR) / 2, yInU, (xInR - xInL) / 2, Math.PI, 0, true);
      c.lineTo(xInR, yArch);
      c.arc((xArchL + xInR) / 2, yArch, (xInR - xArchL) / 2, 0, Math.PI, true);
      c.lineTo(xOutL, yOutU);
      c.arc((xOutL + xOutR) / 2, yOutU, (xOutR - xOutL) / 2, Math.PI, 0, true);
      c.stroke();

      // THE JAW (Orel's call, 2026-08-08). His lower-right free tip hinges where the wide U ends
      // and swings open with the voice. This is where the mic level belongs. The previous build
      // drove pupil SIZE and halo brightness from it instead, and raw RMS jitters every frame, so
      // he flashed and his eyes pulsed. One signal, one moving part.
      c.save();
      c.translate(xOutR, yOutU);
      c.rotate((jaw || 0) * 0.5);           // INWARD, toward his face - shut at rest, ~29 deg open
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(2 * u, yMid - yOutU + 2 * u);
      c.stroke();
      c.restore();
    }

    function clipEyes(c, u, r, squash, asleep) {
      const eyes = [[-11.3 * u, -18.5 * u * squash, 11.8 * u], [6 * u, -10 * u * squash, 10.6 * u]];
      const lookX = (r.look[0] || 0) * 3 * u, lookY = (r.look[1] || 0) * 2.6 * u;
      // Pupils are a FIXED size. They used to dilate with the mic, which read as the eyes growing
      // and shrinking at random. The level lives in the jaw now.
      const dilate = 1;
      for (const [ex, ey, er] of eyes) {
        c.beginPath(); c.ellipse(ex, ey, er * 0.90, er, -0.12, 0, 6.2832);
        c.fillStyle = "#f4f4fb"; c.fill();
        c.lineWidth = Math.max(0.8, u * 0.9); c.strokeStyle = "#a9adcf"; c.stroke();
        if (asleep || r.eyes < 0.2) {
          c.strokeStyle = "#15161c"; c.lineWidth = Math.max(1.4, u * 1.8); c.lineCap = "round";
          c.beginPath(); c.moveTo(ex - er * 0.62, ey); c.lineTo(ex + er * 0.62, ey); c.stroke();
        } else {
          c.beginPath();
          c.ellipse(ex + lookX, ey + lookY, er * 0.56 * r.eyes * dilate, er * 0.50 * r.eyes * dilate, -0.12, 0, 6.2832);
          c.fillStyle = "#15161c"; c.fill();
        }
      }
      // Brows are the only mobile part he has, so they carry every expression. Filled rather than
      // stroked because the TAPER is the tell - an even-width stroke reads as a drawn-on line.
      const raise = r.brow || 0;
      function brow(x1, y1, cxp, cyp, x2, y2, thick) {
        c.beginPath(); c.moveTo(x1, y1);
        c.quadraticCurveTo(cxp, cyp, x2, y2);
        c.quadraticCurveTo(cxp, cyp + thick, x1, y1);
        c.fillStyle = "#15161c"; c.fill();
      }
      const ly = -18.5 * u * squash, ry = -10 * u * squash;
      brow(-24.8 * u, ly - 8.5 * u + raise, -12.3 * u, ly - 17.5 * u + raise,
           -3.8 * u, ly - 10 * u + raise, u * 4);
      brow(3 * u, ry - 13 * u + raise, 14.5 * u, ry - 15 * u + raise,
           17.5 * u, ry - 3 * u + raise, u * 3.4);
    }

    /* The gag reel. Nineteen of Clippy's own animations, fired at random and ONLY while idle -
       a gag on top of real work would hide the state the orb exists to show. Four of them are
       morphs that replace the body entirely and keep only the eyes, which is how the originals
       worked: the character lives in the eyes, so the body is free to become anything. */
    const GAGS = ["sleep", "wave", "lightbulb", "screentap", "watch", "spin", "stretch",
                  "bicycle", "airplane", "magnifier", "alert", "question", "globe",
                  "print", "rollup", "point", "peek", "book", "juggle"];
    let gag = null, gagUntil = 0, nextGagAt = 0;

    function pickGag(nowMs) {
      if (mode !== "idle") { gag = null; nextGagAt = nowMs + 12000; return; }
      if (gag && nowMs > gagUntil) { gag = null; }
      if (!gag && nowMs > nextGagAt) {
        gag = GAGS[(Math.random() * GAGS.length) | 0];
        gagUntil = nowMs + 2800;
        nextGagAt = nowMs + 25000 + Math.random() * 45000;
      }
    }

    function morphEyes(c, u, x, y, er) {
      c.save(); c.translate(x, y);
      for (const sx of [-er * 1.05, er * 1.05]) {
        c.beginPath(); c.ellipse(sx, 0, er * 0.92, er, 0, 0, 6.2832);
        c.fillStyle = "#f4f4fb"; c.fill();
        c.lineWidth = Math.max(0.7, u * 0.8); c.strokeStyle = "#a9adcf"; c.stroke();
        c.beginPath(); c.ellipse(sx, 0, er * 0.52, er * 0.48, 0, 0, 6.2832);
        c.fillStyle = "#15161c"; c.fill();
      }
      c.restore();
    }

    function drawMorph(c, u, which, t) {
      c.strokeStyle = "#8f93bd"; c.lineCap = "round"; c.lineJoin = "round";
      if (which === "bicycle") {
        const x = ((t % 3) / 3 - 0.5) * 40 * u, wy = 20 * u, R = 11.5 * u;
        c.save(); c.translate(x, 0);
        c.lineWidth = Math.max(1.4, u * 2.6);
        for (const wx of [-15 * u, 15 * u]) {
          c.beginPath(); c.arc(wx, wy, R, 0, 6.2832); c.stroke();
          c.save(); c.translate(wx, wy); c.rotate(t * 7); c.lineWidth = Math.max(0.7, u);
          for (let i = 0; i < 4; i++) { c.rotate(Math.PI / 4); c.beginPath(); c.moveTo(-R, 0); c.lineTo(R, 0); c.stroke(); }
          c.restore();
        }
        c.lineWidth = Math.max(1.8, u * 3.4);
        c.beginPath();
        c.moveTo(-15 * u, wy); c.lineTo(-2 * u, -2 * u); c.lineTo(15 * u, wy);
        c.moveTo(-2 * u, -2 * u); c.lineTo(10 * u, -16 * u);
        c.stroke();
        morphEyes(c, u, 4 * u, -20 * u, 5.2 * u);
        c.restore(); return;
      }
      if (which === "globe") {
        const R = 20 * u;
        c.lineWidth = Math.max(1.2, u * 2.2);
        c.beginPath(); c.arc(0, 0, R, 0, 6.2832); c.stroke();
        c.save(); c.beginPath(); c.arc(0, 0, R, 0, 6.2832); c.clip();
        c.lineWidth = Math.max(0.8, u * 1.3);
        for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(-R, i * R * 0.42); c.lineTo(R, i * R * 0.42); c.stroke(); }
        for (let i = 0; i < 4; i++) {
          const ph = ((t * 0.6 + i / 4) % 1) * 2 - 1;
          c.beginPath(); c.ellipse(0, 0, Math.abs(ph) * R, R, 0, 0, 6.2832); c.stroke();
        }
        c.restore();
        morphEyes(c, u, 0, -R * 0.30, 5 * u); return;
      }
      if (which === "rollup") {
        const bounce = Math.abs(Math.sin(t * 3.4));
        const R = 15 * u - bounce * 1.2 * u, y = 12 * u - bounce * 20 * u;
        c.save(); c.translate(0, y); c.rotate(t * 4);
        c.lineWidth = Math.max(1.6, u * 3.4);
        c.beginPath();
        for (let a = 0; a < Math.PI * 4; a += 0.18) {
          const rr = R * (0.30 + 0.70 * (a / (Math.PI * 4)));
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          a === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
        }
        c.stroke(); c.restore();
        morphEyes(c, u, 0, y - R * 0.15, 4.2 * u); return;
      }
      // paper plane
      const p = (t % 3.2) / 3.2;
      c.save();
      c.translate((p - 0.42) * 48 * u, -Math.sin(p * Math.PI) * 16 * u);
      c.rotate(-0.22 + Math.sin(p * Math.PI * 2) * 0.10);
      c.lineWidth = Math.max(1.2, u * 2);
      c.fillStyle = "rgba(160,165,205,.30)";
      c.beginPath();
      c.moveTo(-19 * u, -7 * u); c.lineTo(20 * u, 0); c.lineTo(-19 * u, 9 * u); c.lineTo(-11 * u, 0);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-19 * u, -7 * u); c.lineTo(-11 * u, 0); c.stroke();
      morphEyes(c, u, 2 * u, -1.5 * u, 4 * u);
      c.restore();
    }

    /* Props that belong to a gag rather than to a working state. Gated on tile size: below ~70px
       a lightbulb is four grey pixels, which reads as a rendering bug and not as a joke. */
    function drawGagProps(c, u, W, which, t) {
      if (W < 70) return;
      if (which === "lightbulb") {
        const by = -40 * u;
        c.save(); c.globalAlpha = 0.55 + Math.abs(Math.sin(t * 4)) * 0.45;
        c.strokeStyle = "#ffd66b"; c.fillStyle = "rgba(255,214,107,.22)";
        c.lineWidth = Math.max(1.2, u * 2);
        c.beginPath(); c.arc(0, by, 7.5 * u, 0, 6.2832); c.fill(); c.stroke();
        c.beginPath(); c.moveTo(-3 * u, by + 8.2 * u); c.lineTo(3 * u, by + 8.2 * u); c.stroke();
        c.lineWidth = Math.max(0.9, u * 1.3);
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * 6.2832 + t;
          c.beginPath();
          c.moveTo(Math.cos(a) * 10.5 * u, by + Math.sin(a) * 10.5 * u);
          c.lineTo(Math.cos(a) * 14 * u, by + Math.sin(a) * 14 * u);
          c.stroke();
        }
        c.restore();
      }
      if (which === "screentap") {
        c.save(); c.strokeStyle = "rgba(255,255,255,.5)";
        for (let i = 0; i < 3; i++) {
          const p = ((t * 1.4 + i * 0.33) % 1);
          c.globalAlpha = (1 - p) * 0.8; c.lineWidth = Math.max(0.8, u * 1.2);
          c.beginPath(); c.arc(20 * u, 2 * u, (3 + p * 16) * u, 0, 6.2832); c.stroke();
        }
        c.restore();
      }
      if (which === "watch") {
        c.save(); c.strokeStyle = "#d6dae8"; c.lineWidth = Math.max(1, u * 1.6);
        c.beginPath(); c.arc(20 * u, 14 * u, 5.8 * u, 0, 6.2832); c.stroke();
        c.lineWidth = Math.max(0.8, u * 1.2);
        c.beginPath(); c.moveTo(20 * u, 14 * u); c.lineTo(20 * u, 10.4 * u); c.stroke();
        c.beginPath(); c.moveTo(20 * u, 14 * u);
        c.lineTo(20 * u + Math.cos(t * 6) * 3 * u, 14 * u + Math.sin(t * 6) * 3 * u); c.stroke();
        c.restore();
      }
      if (which === "magnifier") {
        const my = -4 * u + Math.sin(t * 3) * 2 * u;
        c.save(); c.strokeStyle = "#d6dae8"; c.lineWidth = Math.max(1.2, u * 2);
        c.beginPath(); c.arc(19 * u, my, 7.8 * u, 0, 6.2832);
        c.fillStyle = "rgba(190,205,255,.12)"; c.fill(); c.stroke();
        c.beginPath(); c.moveTo(24.5 * u, my + 5.5 * u); c.lineTo(30.5 * u, my + 11.5 * u); c.stroke();
        c.restore();
      }
      if (which === "alert" || which === "question") {
        c.save();
        c.fillStyle = which === "alert" ? "#ffd66b" : "#7cc4ff";
        c.font = `800 ${26 * u}px system-ui`; c.textAlign = "center";
        const pop = 1 + Math.abs(Math.sin(t * 5)) * 0.18;
        c.translate(20 * u, -26 * u); c.scale(pop, pop);
        c.fillText(which === "alert" ? "!" : "?", 0, 0);
        c.restore();
      }
      if (which === "print") {
        const p = (t % 2) / 2;
        c.save(); c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = Math.max(1, u * 1.4);
        c.strokeRect(14 * u, 6 * u, 22 * u, 26 * u * p);
        c.restore();
      }
      if (which === "point") {
        c.save(); c.strokeStyle = "#8f93bd"; c.lineWidth = Math.max(1.6, u * 3.4); c.lineCap = "round";
        const reach = (20 + Math.abs(Math.sin(t * 3)) * 6) * u;
        c.beginPath(); c.moveTo(10 * u, 2 * u); c.lineTo(reach, -2 * u); c.stroke();
        c.restore();
      }
      if (which === "book") {
        const flip = Math.abs(Math.sin(t * 1.2));
        c.save(); c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = Math.max(1, u * 1.4);
        c.beginPath();
        c.moveTo(6 * u, 16 * u); c.lineTo(-9 * u, 11.5 * u); c.lineTo(-9 * u, 23 * u);
        c.lineTo(6 * u, 27.7 * u); c.lineTo(21 * u, 23 * u);
        c.lineTo(6 * u + 15 * u * flip, 11.5 * u); c.lineTo(6 * u, 16 * u);
        c.stroke(); c.restore();
      }
      if (which === "juggle") {
        c.save(); c.fillStyle = "#d6dae8";
        for (let i = 0; i < 3; i++) {
          const a = t * 3 + (i / 3) * 6.2832;
          c.beginPath();
          c.arc(Math.cos(a) * 16 * u, -30 * u + Math.sin(a) * 6 * u, 2.6 * u, 0, 6.2832);
          c.fill();
        }
        c.restore();
      }
      if (which === "sleep") {
        c.save(); c.fillStyle = "rgba(255,255,255,.5)";
        c.font = `600 ${11 * u}px system-ui`;
        for (let i = 0; i < 3; i++) {
          const p = ((t * 0.5 + i * 0.33) % 1);
          c.globalAlpha = 1 - p;
          c.fillText("z", (16 + p * 10) * u, (-20 - p * 18) * u);
        }
        c.restore();
      }
    }

    function drawClippy(c, W, r, t) {
      const cx = W / 2, cy = W / 2, u = W / 100;
      // r.mouth is the rig's mic-level channel while recording; otherwise he is quiet, with a
      // faint idle motion so he does not look frozen.
      const jaw = mode === "recording" ? Math.min(1, r.mouth)
                : mode === "idle" ? 0.05 + Math.sin(t * 1.6) * 0.05
                : 0.10;
      let squash = 1, bend = 0, lean = 0, spin = 0, hop = 0, peekX = 0;

      // State drives posture. He has no limbs, so the whole body does the acting.
      // Leaning in is the listening pose; SCALING is not. A 6% squash on state change read as
      // the character resizing itself the moment you started talking.
      if (mode === "recording")    { lean = 0.16; }
      if (mode === "transcribing") { hop = Math.sin(t * 18) * 0.6 * u; bend = Math.sin(t * 18) * u; }
      if (mode === "translating")  { squash = 0.92; }
      if (mode === "pasting")      { lean = 0.28; }
      if (mode === "idle")         { squash = 1 + Math.sin(t * 2) * 0.015; }

      if (gag) {
        if (gag === "bicycle" || gag === "airplane" || gag === "globe" || gag === "rollup") {
          c.save();
          c.translate(cx, cy);
          c.shadowColor = "rgba(0,0,0,0.5)";
          c.shadowBlur = Math.max(3, u * 6);
          c.shadowOffsetY = Math.max(1, u * 2);
          drawMorph(c, u, gag, t);
          c.restore();
          return;
        }
        if (gag === "sleep")     { squash = 0.82; lean = 0.22; }
        if (gag === "wave")      { lean = Math.sin(t * 5) * 0.16; }
        if (gag === "lightbulb") { squash = 1.05 + Math.sin(t * 9) * 0.02; lean = -0.03; }
        if (gag === "screentap") { squash = 1 + Math.sin(t * 7) * 0.03; lean = 0.13; }
        if (gag === "watch")     { lean = 0.20; }
        if (gag === "spin")      { spin = t * 5; squash = 0.88; }
        if (gag === "stretch")   { squash = 1 + Math.abs(Math.sin(t * 2.2)) * 0.55; }
        if (gag === "magnifier") { lean = -0.06; }
        if (gag === "alert")     { hop = -Math.abs(Math.sin(t * 7)) * 6 * u; squash = 1.04; }
        if (gag === "question")  { lean = 0.16 + Math.sin(t * 2) * 0.04; }
        if (gag === "point")     { lean = 0.30; }
        if (gag === "peek")      { peekX = -(16 + Math.sin(t * 1.6) * 10) * u; lean = 0.10; }
        if (gag === "book")      { lean = 0.08; }
        if (gag === "juggle")    { hop = Math.sin(t * 6) * 1.2 * u; }
      }

      c.save();
      c.translate(cx + peekX, cy + hop);
      c.rotate(-0.07 + lean + spin);   // never upright: drawn straight he is an office-supply icon

      c.strokeStyle = "#8f93bd";       // lavender, never grey - the colour is half the recognition
      c.lineWidth = Math.max(2.2, u * 5.8);
      c.lineCap = "round"; c.lineJoin = "round";
      // THE SHADOW IS THE ONLY THING SEPARATING HIM FROM THE DESKTOP now that the glass tile is
      // gone. It is drawn here rather than set on the window because the window's shadow is the
      // shadow of a RECTANGLE, which is exactly the shape being removed. Soft and offset down,
      // so he reads as sitting above the screen rather than stuck to it.
      c.save();
      c.shadowColor = "rgba(0,0,0,0.55)";
      c.shadowBlur = Math.max(3, u * 7);
      c.shadowOffsetY = Math.max(1, u * 2.2);
      clipWire(c, u, squash, bend, jaw);   // shadow pass: same path, so the silhouette casts it
      c.restore();
      clipWire(c, u, squash, bend, jaw);
      c.save();                         // a thinner lighter pass reads as rounded metal
      c.strokeStyle = "rgba(210,214,240,.75)";
      c.lineWidth = Math.max(0.8, u * 2);
      c.translate(-0.6 * u, -0.6 * u);
      clipWire(c, u, squash, bend, jaw);
      c.restore();

      // The eyes get their own, tighter shadow: they are the brightest thing on him and would
      // otherwise float free of the body against a light background.
      c.save();
      c.shadowColor = "rgba(0,0,0,0.45)";
      c.shadowBlur = Math.max(2, u * 4);
      c.shadowOffsetY = Math.max(1, u * 1.4);
      clipEyes(c, u, r, squash, gag === "sleep");
      c.restore();
      if (gag) drawGagProps(c, u, W, gag, t);
      else drawProps(c, W, r, t);
      c.restore();
    }

    function frame(nowMs) {
      const t = nowMs / 1000;
      // Blink is irregular on purpose: a metronomic blink reads as a screensaver.
      if (nowMs > blinkAt) { blinkAt = nowMs + 1800 + Math.random() * 3600; blinkTil = nowMs + 130; }
      const blink = nowMs < blinkTil ? 0.05 : 1;

      if ((mode === "done" || mode === "error") && Date.now() >= flashUntil) mode = "idle";

      // Same curve the menu-bar meter uses, so the two indicators can never disagree about how
      // loud the room is.
      // Smoothed: raw RMS swings hard between syllables, and anything driven straight off it
      // strobes. Fast to open, slower to close, which is how a jaw actually moves.
      const raw = Math.min(1, level * 9);
      levelSmooth += (raw - levelSmooth) * (raw > levelSmooth ? 0.35 : 0.12);
      const loud = levelSmooth;
      pickGag(nowMs);
      const r = rig(mode, loud, t, blink);

      const W = canvas.width, cx = W / 2, cy = W / 2;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, W);

      // The state colour survives as a halo, so the stage is still readable from the corner of
      // the eye without looking at the face.
      const [r0, g0, b0] = r.tint;
      // While recording the halo BREATHES with the mic. The character has no mouth any more, so
      // this is the only thing left that answers "are you hearing me?" without reading a colour.
      // The halo is STEADY. Driving its brightness and radius from the raw mic made the whole orb
      // flash on every syllable; it only says which stage we are in.
      const alpha = mode === "idle" ? 0.16 : 0.36;
      const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.56);
      halo.addColorStop(0, `rgba(${r0},${g0},${b0},${alpha})`);
      halo.addColorStop(1, `rgba(${r0},${g0},${b0},0)`);
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(cx, cy, W * 0.56, 0, 6.2832); ctx.fill();

      ctx.save();
      ctx.scale(DPR, DPR);
      drawClippy(ctx, W / DPR, r, t);
      ctx.restore();

      tickTimers();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
