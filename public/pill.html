<!doctype html>
<!-- The orb: a Dock-tile squircle of milky glass with a living light inside it.

     The glass is NOT drawn here. It is a real NSVisualEffectView applied to the WINDOW
     (see show_pill in lib.rs) - CSS backdrop-filter on a transparent Tauri window paints a
     square halo, measured 2026-08-06. This page is fully transparent and contributes only
     the tile's edge treatment plus the canvas light.

     The light is one asymmetric blob that drifts inside the frame, deformed by several
     harmonics at unrelated frequencies so it never visibly repeats, lit from an off-centre
     core so it reads as glowing from within rather than as a coloured shape. State is
     colour and behaviour: idle breathes, recording follows the REAL mic level ("level"
     events, ~30Hz), transcribing/translating churn, paste flashes green, error red. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  :root {
    /* The window is RESIZABLE, so only the radius is fixed here - and it must equal
       PILL_RADIUS in lib.rs, which clips the glass. It stays constant rather than scaling with
       the window because window-vibrancy's apply_vibrancy ADDS a new NSVisualEffectView every
       call and never removes the old one, so re-applying it per resize would stack views
       without bound. A constant corner on a resizable panel is the normal look anyway. */
    --radius: 23px;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  body:active { cursor: grabbing; }

  /* Clips the light to the tile. Without it the glow squares off at the window corners and
     the squircle silhouette is lost. */
  #tile {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
  }
  /* The edge treatment that makes it read as a Dock tile rather than a floating rectangle:
     a bright specular hairline along the top, a hairline outline, and a contact shade at the
     bottom. All inset - the window is exactly tile-sized, so an outer shadow would be clipped. */
  #edge {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    pointer-events: none;
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.55),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.14),
      inset 0 -1px 1.5px rgba(0, 0, 0, 0.28);
  }
</style>
</head>
<body>
  <div id="tile"><canvas id="eq"></canvas></div>
  <div id="edge"></div>
  <script>
    // Degrade to a standalone page when there is no Tauri around it. This is not defensive
    // padding: it means this exact file can be opened in a browser and judged - animation and
    // all - without a multi-minute Rust rebuild in between. The fake driver cycles the states
    // and feeds a plausible mic level so a preview exercises every one of them.
    const TAURI = typeof window.__TAURI__ !== "undefined";
    const listen = TAURI
      ? window.__TAURI__.event.listen
      : (name, cb) => {
          if (name === "level") {
            setInterval(() => cb({ payload: 0.015 + Math.random() * 0.11 }), 60);
          }
          if (name === "state") {
            const cycle = ["idle", "recording", "recording", "transcribing", "translating"];
            let i = 0;
            setInterval(() => cb({ payload: cycle[i++ % cycle.length] }), 3200);
          }
        };

    if (TAURI) {
      // Native drag from the middle of the tile - but NOT from the edges. The window is
      // borderless and resizable, so macOS owns a thin resize band around the frame; grabbing
      // there must resize, not move. Without this guard startDragging swallows every resize
      // attempt and the window silently cannot be resized at all.
      const EDGE = 8;
      const { getCurrentWindow } = window.__TAURI__.window;
      document.body.addEventListener("mousedown", (e) => {
        if (e.buttons !== 1) return;
        const onEdge =
          e.clientX < EDGE ||
          e.clientY < EDGE ||
          e.clientX > window.innerWidth - EDGE ||
          e.clientY > window.innerHeight - EDGE;
        if (onEdge) return;
        getCurrentWindow().startDragging();
      });
    }

    const canvas = document.getElementById("eq");
    const DPR = window.devicePixelRatio || 2;
    const ctx = canvas.getContext("2d");

    // The window is resizable, so nothing here may bake in a size. W/H are the live window,
    // SIZE is the smaller of the two and is what every radius scales off, so the organism stays
    // round-ish in a non-square window instead of shearing.
    let W = 104;
    let H = 104;
    let SIZE = 104;
    let CX = 52;
    let CY = 52;

    // Random-walk state for the whole organism. Declared HERE on purpose: an earlier revision
    // lost these declarations in a refactor, `vx` was read before assignment, and NaN
    // propagated into every coordinate - the canvas drew nothing at all and looked like a
    // blank tile rather than an error.
    let px = CX;
    let py = CY;
    let vx = 0;
    let vy = 0;
    let tx = CX;
    let ty = CY;
    let nextRetarget = 0;

    function fit() {
      W = Math.max(48, window.innerWidth);
      H = Math.max(48, window.innerHeight);
      SIZE = Math.min(W, H);
      CX = W / 2;
      CY = H / 2;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      // Re-centre so a resize never leaves the organism drifting outside the new frame.
      px = CX;
      py = CY;
      tx = CX;
      ty = CY;
      vx = 0;
      vy = 0;
    }
    fit();
    window.addEventListener("resize", fit);

    // Each state is a light, not a colour swatch: `core` is the hot centre, `rim` the falloff,
    // `energy` how hard the blob is driven, `drift` how far it wanders from centre.
    // `glow` is the light SPILLING onto the glass, and it is deliberately 0 at idle. Painting
    // it at idle fills the whole tile with a haze of the rim colour, so the orb sits in a navy
    // wash instead of floating in clear glass. The spill belongs to activity, not to presence.
    const STATES = {
      idle:         { core: [200, 218, 255], rim: [120, 150, 220], energy: 0.16, drift: 2.2, speed: 0.30, glow: 0.00 },
      recording:    { core: [255, 214, 202], rim: [255,  69,  58], energy: 1.00, drift: 5.0, speed: 1.15, glow: 0.55 },
      transcribing: { core: [255, 240, 190], rim: [255, 214,  10], energy: 0.52, drift: 4.0, speed: 0.95, glow: 0.30 },
      translating:  { core: [206, 244, 255], rim: [100, 210, 255], energy: 0.52, drift: 4.0, speed: 0.95, glow: 0.30 },
      done:         { core: [214, 255, 224], rim: [ 48, 209,  88], energy: 0.70, drift: 2.0, speed: 0.55, glow: 0.45 },
      error:        { core: [255, 205, 200], rim: [255,  69,  58], energy: 0.85, drift: 1.5, speed: 1.30, glow: 0.45 },
    };

    let mode = "idle";
    let level = 0;        // live mic RMS, 0..~0.2
    let flashUntil = 0;
    // Everything the eye sees is an eased value, never the raw target - a snap between states
    // reads as a glitch, and the whole point is that this thing feels alive.
    let shown = {
      core: [...STATES.idle.core],
      rim: [...STATES.idle.rim],
      energy: 0.16,
      drift: 2.2,
      speed: 0.3,
      glow: 0.0,
    };
    let loudness = 0;

    listen("state", (e) => {
      const s = e.payload;
      if (s === "idle") {
        if (Date.now() >= flashUntil) mode = "idle";
        return;
      }
      mode = s;
    });
    listen("level", (e) => { level = e.payload; });
    listen("result", () => { mode = "done"; flashUntil = Date.now() + 1200; });
    listen("error", () => { mode = "error"; flashUntil = Date.now() + 1600; });

    const lerp = (a, b, k) => a + (b - a) * k;
    const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

    /**
     * The MEMBRANE: the asymmetric boundary the network lives inside. Same harmonics as before
     * (2/3/5/7, no common factor, so the silhouette never repeats), but it is no longer drawn -
     * it is the region nodes are positioned relative to. That is what makes the constellation
     * flex as one organism instead of as points floating in a bag.
     */
    function membrane(angle, r, wob, t) {
      const d =
        Math.sin(angle * 2 + t * 0.9) * 0.55 +
        Math.sin(angle * 3 - t * 1.3) * 0.3 +
        Math.sin(angle * 5 + t * 0.6) * 0.16 +
        Math.sin(angle * 7 - t * 1.9) * 0.08;
      return r * (1 + d * wob);
    }

    // Nodes are stored in POLAR coordinates relative to the membrane - an angle and a fraction
    // of the local radius - not as x/y. That is the whole trick: when the membrane deforms,
    // every node follows it for free, so the network stretches and squashes as a body.
    const NODE_COUNT = 20;
    const nodes = Array.from({ length: NODE_COUNT }, () => ({
      a: Math.random() * Math.PI * 2,
      rf: 0.12 + Math.sqrt(Math.random()) * 0.86, // sqrt keeps them area-uniform, not centre-heavy
      va: (Math.random() - 0.5) * 0.006,
      vrf: (Math.random() - 0.5) * 0.004,
      lit: 0,                                      // brightness left over from a pulse landing
    }));

    // A pulse travelling from one node to another: the synapse firing. This is the part that
    // makes it read as a brain rather than as a particle toy.
    const pulses = [];
    let nextFire = 0;

    let t = 0;
    function frame() {
      const target = STATES[mode] || STATES.idle;
      // Ease every property toward the active state. 0.07 is slow enough to see the change
      // happen and fast enough that a stage boundary still feels immediate.
      for (let i = 0; i < 3; i++) {
        shown.core[i] = lerp(shown.core[i], target.core[i], 0.07);
        shown.rim[i] = lerp(shown.rim[i], target.rim[i], 0.07);
      }
      shown.energy = lerp(shown.energy, target.energy, 0.07);
      shown.drift = lerp(shown.drift, target.drift, 0.07);
      shown.speed = lerp(shown.speed, target.speed, 0.07);
      shown.glow = lerp(shown.glow, target.glow, 0.07);

      // Mic level is spiky; ease it asymmetrically - fast attack so a syllable registers, slow
      // release so the network keeps firing through the gaps between words.
      const raw = Math.min(1, level * 9);
      loudness = raw > loudness ? lerp(loudness, raw, 0.45) : lerp(loudness, raw, 0.1);

      t += 0.016 * (0.6 + shown.speed);
      ctx.clearRect(0, 0, W, H);

      // Unpredictable wander of the whole organism. A Lissajous path is periodic, so the eye
      // learns it within seconds and it stops reading as alive; this picks random destinations
      // at random intervals and is pulled toward them by a damped spring.
      if (t >= nextRetarget) {
        const reach = SIZE * 0.045 * (0.4 + shown.drift * 0.16);
        const a = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * reach;
        tx = CX + Math.cos(a) * r;
        ty = CY + Math.sin(a) * r;
        nextRetarget = t + 0.35 + Math.random() * 1.6;
      }
      const stiff = 0.01 + 0.02 * shown.energy;
      vx = (vx + (tx - px) * stiff) * 0.9;
      vy = (vy + (ty - py) * stiff) * 0.9;
      px += vx;
      py += vy;
      const cx = px;
      const cy = py;

      // Size IS the volume readout. Ceiling is 80% of the tile as a diameter.
      const drive = mode === "recording" ? loudness : 1;
      const breathe = 1 + 0.04 * Math.sin(t * 1.1);
      const MAX_R = SIZE * 0.4;
      const span = mode === "recording" ? 0.52 + 0.48 * loudness : 0.78;
      const radius = MAX_R * span * breathe;
      const wob = 0.1 + 0.2 * shown.energy * (0.45 + 0.55 * drive);

      // --- move the nodes, then resolve them to screen space through the membrane ---
      const pts = [];
      for (const n of nodes) {
        n.a += n.va * (0.5 + shown.speed);
        n.rf += n.vrf * (0.5 + shown.speed);
        // Reflect at the edges rather than wrapping: wrapping teleports a node across the
        // organism, which the eye reads as a glitch.
        if (n.rf > 0.98 || n.rf < 0.10) {
          n.vrf *= -1;
          n.rf = Math.max(0.1, Math.min(0.98, n.rf));
        }
        // Occasional retarget keeps the drift from settling into a steady orbit.
        if (Math.random() < 0.004) {
          n.va = (Math.random() - 0.5) * 0.008;
          n.vrf = (Math.random() - 0.5) * 0.005;
        }
        n.lit *= 0.94;
        const rr = membrane(n.a, radius, wob, t) * n.rf;
        pts.push({ x: cx + Math.cos(n.a) * rr, y: cy + Math.sin(n.a) * rr, n });
      }

      // --- the grid: links appear between nodes that drift close together ---
      // The threshold WIDENS with loudness, so the network visibly densifies as you speak and
      // thins back out in silence. That is the volume readout the eye actually notices.
      const linkMax = radius * (0.62 + 0.30 * (mode === "recording" ? loudness : 0.35));
      const edges = [];
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineWidth = 1;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const dx = pts[i].x - pts[j].x;
          const dy = pts[i].y - pts[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist > linkMax) continue;
          edges.push([i, j]);
          // Opacity falls off toward the threshold, so links FADE in and out instead of
          // popping - that fade is what separates a living network from a static mesh.
          const k = 1 - dist / linkMax;
          ctx.strokeStyle = rgba(shown.rim, 0.06 + 0.42 * k * k);
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.stroke();
        }
      }
      ctx.restore();

      // --- fire a synapse ---
      // Rate scales hard with speech: silence is a slow, sparse blink; talking is a storm.
      if (t >= nextFire && edges.length > 0) {
        const [i, j] = edges[(Math.random() * edges.length) | 0];
        pulses.push({ i, j, u: 0, speed: 0.020 + Math.random() * 0.03 });
        const rate = 0.10 + 0.9 * (1 - (mode === "recording" ? loudness : 0.25));
        nextFire = t + rate * (0.4 + Math.random());
      }
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let k = pulses.length - 1; k >= 0; k--) {
        const p = pulses[k];
        p.u += p.speed * (0.6 + shown.speed);
        if (p.u >= 1 || !pts[p.i] || !pts[p.j]) {
          if (pts[p.j]) pts[p.j].n.lit = 1; // the far end lights up as the signal lands
          pulses.splice(k, 1);
          continue;
        }
        const x = pts[p.i].x + (pts[p.j].x - pts[p.i].x) * p.u;
        const y = pts[p.i].y + (pts[p.j].y - pts[p.i].y) * p.u;
        const trail = ctx.createRadialGradient(x, y, 0, x, y, 3.2);
        trail.addColorStop(0, rgba([255, 255, 255], 0.95));
        trail.addColorStop(0.5, rgba(shown.core, 0.5));
        trail.addColorStop(1, rgba(shown.core, 0));
        ctx.fillStyle = trail;
        ctx.beginPath();
        ctx.arc(x, y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // --- the nodes themselves, drawn last so they sit on top of their own links ---
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const p of pts) {
        const lit = p.n.lit;
        const r = 1.15 + 1.7 * lit + 0.5 * drive;
        const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.4);
        halo.addColorStop(0, rgba(shown.core, 0.85 + 0.15 * lit));
        halo.addColorStop(0.35, rgba(shown.rim, 0.30 + 0.4 * lit));
        halo.addColorStop(1, rgba(shown.rim, 0));
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 3.4, 0, Math.PI * 2);
        ctx.fill();
        // A hard white centre keeps the point readable at 104px, where a pure glow turns to mush.
        ctx.fillStyle = rgba([255, 255, 255], 0.75 + 0.25 * lit);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 0.62, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // A faint bloom behind everything, so the network still reads as lit from within rather
      // than as a flat wireframe. Zero at idle - see `glow` in STATES.
      const spill = shown.glow * (mode === "recording" ? 0.35 + 0.65 * drive : 1);
      if (spill > 0.02) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.filter = "blur(10px)";
        const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        bg.addColorStop(0, rgba(shown.rim, 0.30 * spill));
        bg.addColorStop(1, rgba(shown.rim, 0));
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Specular sweep across the top of the tile - the glass catching light, not the orb.
      const sg = ctx.createLinearGradient(0, 0, 0, H * 0.55);
      sg.addColorStop(0, "rgba(255,255,255,0.10)");
      sg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, H * 0.55);

      if ((mode === "done" || mode === "error") && Date.now() >= flashUntil) mode = "idle";
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
