<!doctype html>
<!-- The orb: an always-visible round equalizer, draggable anywhere. The Dock-style glass
     comes from a macOS vibrancy material applied to the WINDOW (see show_pill in lib.rs);
     this page is fully transparent and only draws the equalizer on a centered canvas.
     States are color and motion: idle dim, recording red on the REAL mic level ("level"
     events, ~30Hz), transcribing/translating spinning wave, paste green, error red. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 72px;
    height: 72px;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 72px;
    height: 72px;
  }
</style>
</head>
<body>
  <canvas id="eq"></canvas>
  <script>
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    // Native drag from anywhere on the orb.
    document.body.addEventListener("mousedown", (e) => {
      if (e.buttons === 1) getCurrentWindow().startDragging();
    });

    const canvas = document.getElementById("eq");
    const DPR = window.devicePixelRatio || 2;
    canvas.width = 72 * DPR;
    canvas.height = 72 * DPR;
    const ctx = canvas.getContext("2d");
    ctx.scale(DPR, DPR);

    const CX = 36, CY = 36;   // exact window center - the ring is concentric by construction
    const R_IN = 13;          // bar inner radius
    const LEN = 13;           // bar max length
    const N = 14;

    const COLORS = {
      idle: "rgba(235, 235, 245, 0.45)",
      recording: "#ff453a",
      transcribing: "#ffd60a",
      translating: "#64d2ff",
      done: "#30d158",
      error: "#ff453a",
    };

    let mode = "idle";
    let level = 0;
    let flashUntil = 0;
    const amp = new Array(N).fill(0.18);
    const jitter = Array.from({ length: N }, () => 0.6 + Math.random() * 0.8);

    listen("state", (e) => {
      const s = e.payload;
      if (s === "idle") {
        if (Date.now() >= flashUntil) mode = "idle";
        return;
      }
      mode = s;
    });
    listen("level", (e) => { level = e.payload; });
    listen("result", () => { mode = "done"; flashUntil = Date.now() + 1200; });
    listen("error", () => { mode = "error"; flashUntil = Date.now() + 1600; });

    let t = 0;
    function frame() {
      t += 0.055;
      ctx.clearRect(0, 0, 72, 72);
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.strokeStyle = COLORS[mode] || COLORS.idle;
      for (let i = 0; i < N; i++) {
        let target;
        if (mode === "recording") {
          const v = Math.min(1, level * 9);
          target = 0.15 + v * jitter[i] * (0.55 + 0.45 * Math.sin(t * 3 + i * 1.7));
        } else if (mode === "transcribing" || mode === "translating") {
          target = 0.22 + 0.6 * Math.pow(0.5 + 0.5 * Math.sin(t * 2.6 - (i / N) * Math.PI * 2), 2);
        } else if (mode === "done" || mode === "error") {
          target = 0.7 + 0.2 * Math.sin(t * 1.2 + i * 0.4);
          if (Date.now() >= flashUntil) mode = "idle";
        } else {
          target = 0.16 + 0.06 * (0.5 + 0.5 * Math.sin(t * 0.8 + i * 0.45));
        }
        amp[i] += (target - amp[i]) * 0.35;
        const a = (i / N) * Math.PI * 2 - Math.PI / 2;
        const len = Math.max(2, LEN * Math.min(1, amp[i]));
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(a) * R_IN, CY + Math.sin(a) * R_IN);
        ctx.lineTo(CX + Math.cos(a) * (R_IN + len), CY + Math.sin(a) * (R_IN + len));
        ctx.stroke();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
